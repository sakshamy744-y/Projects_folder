<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Test App</title>
  <meta name="theme-color" content="#4A90E2">

  <!-- Favicon (Inline SVG Data URI) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234A90E2'/><path d='M30 50 L45 65 L70 35' stroke='white' stroke-width='8' fill='none' stroke-linecap='round'/></svg>">

  <!-- PWA Manifest with Unique ID & Scope -->
  <link rel="manifest" href='data:application/manifest+json,{
    "id": "/Projects_folder/pwatest.html",
    "name": "PWA Test App",
    "short_name": "PWATest",
    "start_url": "./pwatest.html",
    "scope": "./pwatest.html",
    "display": "standalone",
    "background_color": "#ffffff",
    "theme_color": "#4A90E2",
    "icons": [
      {
        "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%234A90E2%22/><path d=%22M30 50 L45 65 L70 35%22 stroke=%22white%22 stroke-width=%228%22 fill=%22none%22 stroke-linecap=%22round%22/></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml",
        "purpose": "any maskable"
      }
    ]
  }'>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f7f6;
      color: #333;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 320px;
      width: 90%;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 1rem;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.1s ease;
      border: none;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-download {
      background-color: #0078d4;
      color: white;
    }
    .btn-download:hover {
      background-color: #005a9e;
    }
    .btn-install {
      background-color: #4A90E2;
      color: white;
    }
    .btn-install:hover {
      background-color: #357abd;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- App Logo -->
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="20" fill="#4A90E2"/>
      <path d="M30 50 L45 65 L70 35" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
    </svg>

    <h2>PWA Test App</h2>
    <p>Install the native web app or download the file for your device.</p>

    <div class="button-group">
      <!-- Dynamic File Download Button (Changes based on Desktop vs Mobile) -->
      <a id="fileDownloadBtn" href="./my-setup-file.exe" download="MyAppInstaller.exe" class="btn btn-download">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span id="downloadBtnText">Download App (.exe)</span>
      </a>

      <!-- Native PWA Install Button -->
      <button id="installBtn" class="btn btn-install" style="display: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="3"></line>
        </svg>
        Install Native PWA
      </button>
    </div>
  </div>

  <script>
    // 1. Device Detection for APK vs EXE Download
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const fileDownloadBtn = document.getElementById('fileDownloadBtn');
    const downloadBtnText = document.getElementById('downloadBtnText');

    if (isMobile) {
      // Update link & label for mobile devices
      fileDownloadBtn.href = "./pwatest-app.apk"; // Point to your uploaded APK file
      fileDownloadBtn.setAttribute('download', 'PWATestApp.apk');
      downloadBtnText.textContent = "Download App (.apk)";
    }

    // 2. Service Worker with Isolated Scope & Cache Cleaning
    const swCode = `
      const CACHE_NAME = 'pwatest-cache-v1';
      self.addEventListener('install', (e) => self.skipWaiting());
      self.addEventListener('activate', (e) => {
        e.waitUntil(
          caches.keys().then((keys) => {
            return Promise.all(
              keys.filter(key => key !== CACHE_NAME).map(key => caches.delete(key))
            );
          }).then(() => self.clients.claim())
        );
      });
      self.addEventListener('fetch', (e) => {
        if (e.request.mode === 'navigate' && !e.request.url.includes('pwatest.html')) return;
        e.respondWith(
          fetch(e.request).catch(() => caches.match(e.request))
        );
      });
    `;

    if ('serviceWorker' in navigator) {
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const blobUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(blobUrl);
    }

    // 3. Native PWA Install Prompt Handler
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-flex';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
